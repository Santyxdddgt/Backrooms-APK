name: Build Aether Salvage APK (clean)

on:
  push:
    paths:
      - "Aether-Salvage-limpio.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile clean Android project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check clean source ZIP
        shell: bash
        run: |
          if [[ ! -f "Aether-Salvage-limpio.zip" ]]; then
            echo "::error::No existe Aether-Salvage-limpio.zip en la raíz del repo. Subí ese archivo y volvé a ejecutar el workflow."
            exit 1
          fi
          unzip -t "Aether-Salvage-limpio.zip"

      - name: Extract project
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/aether-salvage-source"
          mkdir -p "$DEST"
          unzip -q "Aether-Salvage-limpio.zip" -d "$DEST"
          SETTINGS_FILE="$(find "$DEST" -type f -name settings.gradle.kts -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::No encuentro settings.gradle.kts dentro del ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" || ! -f "$PROJECT_DIR/app/src/main/assets/index.html" ]]; then
            echo "::error::El ZIP no tiene la estructura Android esperada."
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEY }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.ANDROID_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_B64" ]]; then
            if [[ -z "$STORE_PASS" || -z "$KEY_ALIAS_VALUE" || -z "$KEY_PASS" ]]; then
              echo "::error::Hay una keystore configurada, pero faltan secretos de contraseña o alias. Revisá los nombres de los secretos."
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/signing"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS_VALUE" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "mode=custom" >> "$GITHUB_OUTPUT"
          else
            mkdir -p "$HOME/.android"
            if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
              keytool -genkeypair -v \
                -keystore "$HOME/.android/debug.keystore" \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "ANDROID_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::No encontré secretos de firma reconocidos. El APK se firmará con una clave debug temporal y no podrá actualizar una instalación firmada con otra clave."
          fi

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "${{ steps.extract.outputs.project_dir }}" assembleRelease
          APK="${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p "$RUNNER_TEMP/aether-output"
          cp "$APK" "$RUNNER_TEMP/aether-output/Aether-Salvage.apk"

      - name: Add signing note to run summary
        if: always()
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          if [[ "$SIGNING_MODE" == "custom" ]]; then
            echo "APK firmado con la keystore proporcionada por los secretos de GitHub. Para que sea una actualización, esa clave debe coincidir con la del APK instalado." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ APK de prueba firmado con una clave debug temporal. Android no lo instalará como actualización sobre una app firmada con otra clave." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Salvage-APK-${{ github.run_number }}
          path: ${{ runner.temp }}/aether-output/Aether-Salvage.apk
          if-no-files-found: error
          retention-days: 14

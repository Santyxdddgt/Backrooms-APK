name: Generar APK BACKROOMS

on:
  workflow_dispatch:
  push:
    paths:
      - 'BACKROOMS-APK.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Preparar Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer ZIP completo
        run: |
          unzip -q BACKROOMS-APK.zip -d extracted
          test -f extracted/BACKROOMS/gradlew

      - name: Compilar APK
        working-directory: extracted/BACKROOMS
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: BACKROOMS-APK
          path: extracted/BACKROOMS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

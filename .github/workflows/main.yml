name: Generar APK BACKROOMS

on:
  workflow_dispatch:
  push:
    paths:
      - 'BACKROOMS-APK-listo-para-compilar.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar plataforma Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer ZIP del proyecto
        run: |
          unzip -q BACKROOMS-APK-listo-para-compilar.zip -d extracted
          test -f extracted/BACKROOMS/gradlew
          test -f extracted/BACKROOMS/app/build.gradle.kts

      - name: Compilar APK
        working-directory: extracted/BACKROOMS
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: BACKROOMS-APK
          path: extracted/BACKROOMS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
